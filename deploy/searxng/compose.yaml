name: med-collect-search

services:
  searxng:
    image: ${SEARXNG_IMAGE:?set SEARXNG_IMAGE in release.env}
    pull_policy: never
    user: "977:977"
    init: true
    restart: unless-stopped
    env_file: ./runtime.env
    environment:
      GRANIAN_HOST: 0.0.0.0
      FORCE_OWNERSHIP: "false"
    volumes:
      - type: bind
        source: ./config
        target: /etc/searxng
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./cache
        target: /var/cache/searxng
        bind:
          create_host_path: false
    networks:
      - med_collect
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=3).close()"]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  med_collect:
    name: med-collect_default
    external: true
